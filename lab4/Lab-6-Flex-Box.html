<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexbox Images</title>

  <style>
    #flex_parent {
      height: 100vh;
      display: flex;
      justify-content: space-evenly;
      align-items: center;
    }
  </style>
</head>

<body>

  <div id="flex_parent">

    <img
      src="https://picsum.photos/220/220?random=1"
      alt="Random image 1">

    <img
      src="https://picsum.photos/330/330?random=2"
      alt="Random image 2">

    <img
      src="https://picsum.photos/220/220?random=3"
      alt="Random image 3">

  </div>

</body>

</html>
